<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <g stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Eye Outline -->
    <path d="M 20 100 Q 100 45 180 100 Q 100 155 20 100 Z" stroke-width="8" />

    <!-- Inner Iris Ring -->
    <circle cx="100" cy="100" r="26" stroke-width="12" />

    <!-- Define a single reusable ray for perfect symmetry -->
    <defs>
      <line id="ray" x1="100" y1="32" x2="100" y2="10" stroke-width="5" stroke-linecap="round" />
    </defs>

    <!-- Top Rays -->
    <use href="#ray" />
    <use href="#ray" transform="rotate(30 100 100)" />
    <use href="#ray" transform="rotate(60 100 100)" />
    <use href="#ray" transform="rotate(-30 100 100)" />
    <use href="#ray" transform="rotate(-60 100 100)" />

    <!-- Bottom Rays -->
    <use href="#ray" transform="rotate(180 100 100)" />
    <use href="#ray" transform="rotate(150 100 100)" />
    <use href="#ray" transform="rotate(120 100 100)" />
    <use href="#ray" transform="rotate(210 100 100)" />
    <use href="#ray" transform="rotate(240 100 100)" />
  </g>

  <!-- Solid Pupil Highlight -->
  <circle cx="106" cy="94" r="6" fill="#ffffff" />
</svg>
